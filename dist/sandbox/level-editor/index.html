<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Level Editor</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #2c3e50; color: white; padding: 10px; overflow-y: auto; }
        .main-area { flex: 1; display: flex; flex-direction: column; }
        .toolbar { height: 50px; background: #34495e; display: flex; align-items: center; padding: 0 10px; gap: 10px; }
        .canvas-container { flex: 1; position: relative; overflow: hidden; background: #ecf0f1; }
        #levelCanvas { cursor: crosshair; }
        .tileset-grid { display: grid; grid-template-columns: repeat(8, 32px); gap: 2px; margin: 10px 0; }
        .tile { width: 32px; height: 32px; border: 2px solid transparent; cursor: pointer; }
        .tile.selected { border-color: #3498db; }
        .tool-group { margin: 15px 0; }
        .tool-group h3 { margin: 0 0 10px 0; font-size: 14px; }
        button { padding: 8px 12px; background: #3498db; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #2980b9; }
        input, select { padding: 5px; margin: 5px 0; width: 100%; }
        .object-palette { display: flex; flex-direction: column; gap: 5px; margin: 10px 0; }
        .object-item { 
            padding: 8px; 
            background: #34495e; 
            border: 2px solid transparent; 
            cursor: pointer; 
            border-radius: 4px; 
            font-size: 12px;
            user-select: none;
        }
        .object-item:hover { background: #4a6741; }
        .object-item.selected { border-color: #e74c3c; background: #c0392b; }
        .placed-object {
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
  <script type="module" crossorigin src="/assets/level-editor-DnEUx4nb.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
    <div class="sidebar">
        <h2>Level Editor</h2>
        
        <div class="tool-group">
            <h3>Assets</h3>
            <button id="refreshAssets">🔄 Refresh Assets</button>
            <select id="assetSelect">
                <option value="">Select Tileset...</option>
            </select>
            <div>Tile Size: <input type="number" id="tileSize" value="32" min="16" max="64"></div>
            <div id="tilesetGrid" class="tileset-grid"></div>
        </div>

        <div class="tool-group">
            <h3>Game Levels</h3>
            <select id="levelSelect">
                <option value="">New Level...</option>
            </select>
            <button id="loadLevel">Load Level</button>
            <button id="saveLevel">Save Level</button>
            <button id="saveLevelAs">Save As...</button>
            <button id="deleteLevel">Delete Level</button>
            <div>
                <input type="text" id="levelName" placeholder="Level name..." style="margin: 5px 0;">
            </div>
        </div>

        <div class="tool-group">
            <h3>Tools</h3>
            <button id="paintTool" class="active">Paint</button>
            <button id="eraseTool">Erase</button>
            <button id="fillTool">Fill</button>
            <button id="objectTool">Objects</button>
        </div>

        <div class="tool-group">
            <h3>Objects</h3>
            <div class="object-palette">
                <div class="object-item" data-type="npc" data-subtype="merchant">👤 Merchant</div>
                <div class="object-item" data-type="npc" data-subtype="guard">🛡️ Guard</div>
                <div class="object-item" data-type="npc" data-subtype="villager">👥 Villager</div>
                <div class="object-item" data-type="interactive" data-subtype="chest">📦 Chest</div>
                <div class="object-item" data-type="interactive" data-subtype="door">🚪 Door</div>
                <div class="object-item" data-type="interactive" data-subtype="sign">📋 Sign</div>
                <div class="object-item" data-type="spawn" data-subtype="player">⭐ Player Spawn</div>
            </div>
        </div>

        <div class="tool-group">
            <h3>Layers</h3>
            <select id="layerSelect">
                <option value="background">Background</option>
                <option value="collision">Collision</option>
                <option value="objects">Objects</option>
            </select>
        </div>

        <div class="tool-group">
            <h3>Level Settings</h3>
            <div>Width: <input type="number" id="levelWidth" value="50" min="10" max="200"></div>
            <div>Height: <input type="number" id="levelHeight" value="30" min="10" max="200"></div>
            <button id="newLevel">New Level</button>
        </div>
    </div>

    <div class="main-area">
        <div class="toolbar">
            <span>Zoom: </span>
            <button id="zoomOut">-</button>
            <span id="zoomLevel">100%</span>
            <button id="zoomIn">+</button>
            <button id="gridToggle">Toggle Grid</button>
        </div>
        <div class="canvas-container">
            <canvas id="levelCanvas"></canvas>
        </div>
    </div>

</body>
</html>
