<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC-to-NPC Conversation Sandbox</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #2c3e50; }
        #game-container { width: 100vw; height: 100vh; }
        .controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 5px; z-index: 100; }
        .controls button { margin: 5px; padding: 8px 12px; background: #3498db; color: white; border: none; cursor: pointer; border-radius: 3px; }
        .controls button:hover { background: #2980b9; }
        .conversation-log { position: absolute; top: 10px; right: 10px; width: 300px; max-height: 400px; background: rgba(0,0,0,0.9); color: white; padding: 15px; border-radius: 5px; overflow-y: auto; font-size: 12px; }
        .conversation-entry { margin: 5px 0; padding: 5px; border-left: 3px solid #3498db; }
        .npc-alice { border-left-color: #e74c3c; }
        .npc-bob { border-left-color: #2ecc71; }
    </style>
</head>
<body>
    <div class="controls">
        <h3>NPC Conversation Sandbox</h3>
        <button id="startConversation">Start Conversation</button>
        <button id="addTopic">Add Random Topic</button>
        <button id="clearLog">Clear Log</button>
        <div>
            <label>Conversation Topic:</label>
            <input type="text" id="topicInput" placeholder="Enter topic..." style="width: 200px; margin: 5px 0;">
        </div>
    </div>
    
    <div class="conversation-log" id="conversationLog">
        <h4>Conversation Log</h4>
        <div id="logEntries"></div>
    </div>
    
    <div id="game-container"></div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
