<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool System Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #2c3e50;
            color: white;
        }
        
        .component-header {
            margin-bottom: 20px;
            padding: 10px;
            background: #34495e;
            border-radius: 5px;
        }
        
        .component-header h1 {
            margin: 0 0 10px 0;
            color: #9b59b6;
        }
        
        .component-header p {
            margin: 0;
            color: #bdc3c7;
        }
        
        .back-link {
            color: #3498db;
            text-decoration: none;
            margin-bottom: 15px;
            display: inline-block;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        #game-container {
            width: 100%;
            height: 500px;
            border: 2px solid #34495e;
            border-radius: 5px;
            position: relative;
        }
        
        .controls {
            margin-top: 15px;
            padding: 10px;
            background: #34495e;
            border-radius: 5px;
        }
        
        .controls button {
            margin-right: 10px;
            padding: 8px 15px;
            background: #9b59b6;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .controls button:hover {
            background: #8e44ad;
        }
        
        .log {
            margin-top: 10px;
            padding: 10px;
            background: #2c3e50;
            border-radius: 5px;
            height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #34495e;
        }
    </style>
</head>
<body>
    <a href="/sandbox/" class="back-link">← Back to Sandbox</a>
    
    <div class="component-header">
        <h1>Tool System</h1>
        <p>Test NPCs autonomously using tools to modify the game environment. Watch Sheriff hide evidence!</p>
    </div>
    
    <div id="game-container"></div>
    
    <div class="controls">
        <button onclick="triggerTool('hide_evidence')">Force Hide Evidence</button>
        <button onclick="triggerTool('access_computer')">Force Computer Access</button>
        <button onclick="toggleAutoMode()">Toggle Auto Mode</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="log" id="tool-log">
        <div>Tool System initialized. NPCs will use tools automatically every 10-20 seconds.</div>
    </div>
    
    <script type="module" src="/sandbox/tool-system/main.ts"></script>
</body>
</html>
